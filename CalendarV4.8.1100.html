<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>八字日曆 v4.8 (滑動修正版)</title>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-black: #000000;
            --grid-border: #e0e0e0;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --primary-red: #d00;
            --table-header-bg: #f5f5f7;
            --table-border: #ddd;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            font-family: var(--font-family); background-color: var(--bg-color);
            margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }

        #status-panel {
            position: fixed; top: 15px; left: 15px; background: rgba(33, 33, 33, 0.95);
            color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 13px; z-index: 20000;
            transition: opacity 0.5s; pointer-events: none; border-left: 4px solid #2196f3;
        }

        .content-area { flex: 1; position: relative; overflow: hidden; width: 100%; touch-action: none; cursor: grab; }
        .content-area:active { cursor: grabbing; }

        /* Sheet 1: 今日 */
        #sheet1 { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .bazi-container { display: flex; flex-direction: row-reverse; gap: 20px; padding: 10px; margin-bottom: 5vh; }
        .v-col { display: flex; flex-direction: column; align-items: center; height: 420px; }
        
        .date-col { justify-content: flex-start; font-size: 1.6rem; color: var(--text-black); font-weight: 500; gap: 4px; }
        .date-num { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 5px 0; }
        .v-text { writing-mode: vertical-rl; text-orientation: upright; }
        .week-block { margin-top: 15px; font-size: 1.6rem; text-combine-upright: all; -webkit-text-combine: horizontal; writing-mode: vertical-rl; }
        .roc-title { margin-bottom: 5px; }
        
        .lunar-col { justify-content: flex-start; font-size: 1.4rem; color: #666; font-weight: 500; gap: 4px; padding-right: 15px; border-right: 1px solid #eee; }
        .bazi-col { width: 3.5rem; justify-content: space-between; }
        .col-header { font-size: 1.5rem; display: flex; flex-direction: column; gap: 10px; color: #555; }
        .col-value { font-size: 2.4rem; display: flex; flex-direction: column; gap: 15px; margin-bottom: 60px; font-weight: 500; }

        /* Sheet 2: 本月 */
        #sheet2 { width: 100%; height: 100%; display: none; }
        .calendar-main { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--grid-border); }
        .week-header { display: grid; grid-template-columns: repeat(7, 1fr); height: 35px; background: #f2f2f2; border-bottom: 1px solid var(--grid-border); }
        .week-cell { display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: bold; }
        .days-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; }
        .day-cell { border-right: 1px solid var(--grid-border); border-bottom: 1px solid var(--grid-border); position: relative; padding: 4px; overflow: hidden; }
        .cell-date-num { position: absolute; top: 18px; left: 5px; font-size: 1.6rem; font-weight: bold; font-family: Arial; }
        .cell-ganzhi { position: absolute; top: 50%; right: 5px; transform: translateY(-50%); writing-mode: vertical-rl; color: #666; font-size: 0.9rem; }
        .is-today { background-color: #fff9e6; }
        .is-today .cell-date-num { color: #d00; }
        .side-title-bar { width: 45px; display: flex; align-items: center; justify-content: center; }

        /* Sheet 5: 設定 */
        .memo-sheet { width: 100%; height: 100%; display: none; flex-direction: column; padding: 20px; overflow-y: auto; touch-action: pan-y; }
        .config-code-display { 
            background: #222; color: #0f0; padding: 20px; text-align: center; 
            font-family: monospace; font-size: 2.2rem; border-radius: 10px; margin: 15px 0;
            letter-spacing: 8px; box-shadow: inset 0 0 10px #000;
        }
        .config-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid #eee; }
        .config-label { font-weight: bold; font-size: 1rem; }
        select { padding: 8px; font-size: 1rem; border-radius: 5px; border: 1px solid #ccc; background: #fff; }

        /* Tab */
        .tab-bar { 
            height: calc(65px + env(safe-area-inset-bottom)); 
            padding-bottom: env(safe-area-inset-bottom);
            display: flex; border-top: 1px solid #ccc; background: #fff; 
        }
        .tab-btn { flex: 1; border: none; background: none; font-size: 1.1rem; color: #666; cursor: pointer; }
        .tab-btn.active { color: #000; font-weight: bold; background: #f8f8f8; }
        .divider { width: 1px; height: 30px; background: #ccc; align-self: center; }
    </style>
    
    <script>
        const CDN_URL = "https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.13/lunar.min.js";
        let currentDate = new Date();
        let currentTab = 'sheet1';
        let isLibReady = false;

        let config = { xAxis: 0, yAxis: 0, hDir: 0, vDir: 0 };

        function initConfigFromFilename() {
            try {
                const path = window.location.pathname;
                const fileName = path.split('/').pop();
                const match = fileName.match(/(\d{4})\.html$/);
                if (match && match[1]) {
                    const code = match[1];
                    config.xAxis = parseInt(code[0]);
                    config.yAxis = parseInt(code[1]);
                    config.hDir = parseInt(code[2]);
                    config.vDir = parseInt(code[3]);
                }
            } catch (e) { console.error("解析檔名失敗", e); }
        }

        function updateConfigDisplay() {
            const code = `${config.xAxis}${config.yAxis}${config.hDir}${config.vDir}`;
            const el = document.getElementById('config-code');
            if (el) el.innerText = code;
        }

        function setStatus(msg, type) {
            const panel = document.getElementById('status-panel');
            panel.innerText = msg;
            panel.style.opacity = '1';
            if(type === 'ok') setTimeout(() => panel.style.opacity = '0', 2000);
        }

        function loadScript() {
            initConfigFromFilename();
            const script = document.createElement('script');
            script.src = CDN_URL;
            script.onload = () => {
                if (typeof Solar === 'undefined' && window.lunar) window.Solar = window.lunar.Solar;
                isLibReady = true;
                setStatus("核心就緒 v4.8", "ok");
                updateAllViews();
            };
            document.body.appendChild(script);
        }

        window.onload = loadScript;
    </script>
</head>
<body>

    <div id="status-panel">核心載入中...</div>

    <div class="content-area" id="touchArea">
        <div id="sheet1">
            <div class="bazi-container">
                <div class="v-col date-col" id="dateCol"></div>
                <div class="v-col lunar-col" id="lunarCol"></div>
                <div class="v-col bazi-col"><div class="col-header"><span>年</span><span>柱</span></div><div class="col-value" id="yearGZ">--</div></div>
                <div class="v-col bazi-col"><div class="col-header"><span>月</span><span>柱</span></div><div class="col-value" id="monthGZ">--</div></div>
                <div class="v-col bazi-col"><div class="col-header"><span>日</span><span>柱</span></div><div class="col-value" id="dayGZ">--</div></div>
            </div>
        </div>

        <div id="sheet2">
            <div class="calendar-main">
                <div class="week-header">
                    <div class="week-cell" style="color:red">日</div><div class="week-cell">一</div><div class="week-cell">二</div>
                    <div class="week-cell">三</div><div class="week-cell">四</div><div class="week-cell">五</div><div class="week-cell" style="color:red">六</div>
                </div>
                <div class="days-grid" id="daysGrid"></div>
            </div>
            <div class="side-title-bar"><div class="v-text" id="sideTitle" style="font-weight:bold">--</div></div>
        </div>

        <div id="sheet5" class="memo-sheet">
            <h2 style="text-align:center; margin:0;">操作設定代碼</h2>
            <div class="config-code-display" id="config-code">0000</div>
            <p style="font-size:0.9rem; color:#d00; text-align:center; margin-bottom:20px;">
                請修改檔名末 4 碼以生效。本月 Sheet 已設定全向滑動變更月份。
            </p>
            
            <div class="config-row">
                <div class="config-label">左右滑動功能 (今日)</div>
                <select id="sel-xAxis" onchange="config.xAxis=parseInt(this.value);updateConfigDisplay()">
                    <option value="0">加減日期</option>
                    <option value="1">加減月份</option>
                </select>
            </div>
            <div class="config-row">
                <div class="config-label">上下滑動功能 (今日)</div>
                <select id="sel-yAxis" onchange="config.yAxis=parseInt(this.value);updateConfigDisplay()">
                    <option value="0">加減月份</option>
                    <option value="1">加減日期</option>
                </select>
            </div>
            <div class="config-row">
                <div class="config-label">左右方向</div>
                <select id="sel-hDir" onchange="config.hDir=parseInt(this.value);updateConfigDisplay()">
                    <option value="0">左滑增加 / 右滑減少</option>
                    <option value="1">左滑減少 / 右滑增加</option>
                </select>
            </div>
            <div class="config-row">
                <div class="config-label">上下方向</div>
                <select id="sel-vDir" onchange="config.vDir=parseInt(this.value);updateConfigDisplay()">
                    <option value="0">上滑增加 / 下滑減少</option>
                    <option value="1">上滑減少 / 下滑增加</option>
                </select>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="btn-sheet1" onclick="safeSwitchTab('sheet1')">今日</button>
        <div class="divider"></div>
        <button class="tab-btn" id="btn-sheet2" onclick="safeSwitchTab('sheet2')">本月</button>
        <div class="divider"></div>
        <button class="tab-btn" id="btn-sheet5" onclick="safeSwitchTab('sheet5')">設定</button>
    </div>

    <script>
        function safeSwitchTab(tab) {
            if (!isLibReady) return;
            currentTab = tab;
            if (tab === 'sheet1' || tab === 'sheet2') currentDate = new Date();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + tab)?.classList.add('active');
            ['sheet1', 'sheet2', 'sheet5'].forEach(id => {
                document.getElementById(id).style.display = (id === tab) ? 'flex' : 'none';
            });
            updateAllViews();
            if(tab === 'sheet5') syncUIWithConfig();
        }

        function syncUIWithConfig() {
            document.getElementById('sel-xAxis').value = config.xAxis;
            document.getElementById('sel-yAxis').value = config.yAxis;
            document.getElementById('sel-hDir').value = config.hDir;
            document.getElementById('sel-vDir').value = config.vDir;
            updateConfigDisplay();
        }

        function updateAllViews() {
            if (!isLibReady) return;
            renderSheet1();
            renderSheet2();
        }

        function renderSheet1() {
            const y = currentDate.getFullYear(), m = currentDate.getMonth() + 1, d = currentDate.getDate();
            const solar = Solar.fromYmd(y, m, d);
            const lunar = solar.getLunar();
            const weekStr = ['日', '一', '二', '三', '四', '五', '六'][currentDate.getDay()];
            
            document.getElementById('dateCol').innerHTML = `
                <div class="v-text roc-title">民國</div>
                <div class="date-num">${y-1911}</div><div class="v-text">年</div>
                <div class="date-num">${m}</div><div class="v-text">月</div>
                <div class="date-num">${d}</div><div class="v-text">日</div>
                <div class="week-block">(${weekStr})</div>
            `;
            document.getElementById('lunarCol').innerHTML = `
                <div class="v-text roc-title">農曆</div>
                <div class="v-text" style="font-size:1.8rem; margin-top:10px; color:#333;">${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}</div>
            `;
            
            const setGZ = (id, text) => {
                document.getElementById(id).innerHTML = `<span>${text[0]}</span><span>${text[1]}</span>`;
            };
            setGZ('yearGZ', lunar.getYearInGanZhiExact());
            setGZ('monthGZ', lunar.getMonthInGanZhiExact());
            setGZ('dayGZ', lunar.getDayInGanZhiExact());
        }

        function renderSheet2() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';
            const y = currentDate.getFullYear(), m = currentDate.getMonth() + 1;
            document.getElementById('sideTitle').innerText = `民國${y-1911}年${m}月`;
            const firstDay = new Date(y, m - 1, 1).getDay();
            const daysInMonth = new Date(y, m, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell'; empty.style.background = "#fafafa";
                grid.appendChild(empty);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const cell = document.createElement('div');
                cell.className = `day-cell ${(i === currentDate.getDate()) ? 'is-today' : ''}`;
                const l = Solar.fromYmd(y, m, i).getLunar();
                cell.innerHTML = `<div class="cell-date-num">${i}</div><div class="cell-ganzhi">${l.getDayInGanZhiExact()}</div>`;
                cell.onclick = () => { currentDate = new Date(y, m-1, i); renderSheet1(); renderSheet2(); };
                grid.appendChild(cell);
            }
        }

        // --- 滑動事件處理 (含滑鼠與觸控) ---
        let startX = 0, startY = 0;
        let isMoving = false;
        const ta = document.getElementById('touchArea');

        const start = (x, y) => { startX = x; startY = y; isMoving = true; };
        const end = (x, y) => {
            if (!isMoving || currentTab === 'sheet5') return;
            isMoving = false;
            const dx = startX - x;
            const dy = startY - y;
            const threshold = 40;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > threshold) {
                    const delta = (dx > 0 ? 1 : -1) * (config.hDir === 0 ? 1 : -1);
                    if (currentTab === 'sheet1') {
                        config.xAxis === 0 ? changeDay(delta) : changeMonth(delta);
                    } else if (currentTab === 'sheet2') {
                        changeMonth(delta);
                    }
                }
            } else {
                if (Math.abs(dy) > threshold) {
                    const delta = (dy > 0 ? 1 : -1) * (config.vDir === 0 ? 1 : -1);
                    if (currentTab === 'sheet1') {
                        config.yAxis === 0 ? changeMonth(delta) : changeDay(delta);
                    } else if (currentTab === 'sheet2') {
                        changeMonth(delta);
                    }
                }
            }
        };

        ta.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
        ta.addEventListener('touchend', e => end(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive: true });
        ta.addEventListener('mousedown', e => start(e.clientX, e.clientY));
        window.addEventListener('mouseup', e => end(e.clientX, e.clientY));

        function changeDay(n) { currentDate.setDate(currentDate.getDate() + n); updateAllViews(); }
        function changeMonth(n) { 
            const d = currentDate.getDate();
            currentDate.setMonth(currentDate.getMonth() + n);
            if (currentDate.getDate() < d) currentDate.setDate(0);
            updateAllViews();
        }
    </script>
</body>
</html>
