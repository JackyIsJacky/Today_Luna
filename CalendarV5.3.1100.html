<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>八字日曆 v5.3 (桌面大螢幕優化版)</title>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-black: #000000;
            --text-gray: #333333;
            --grid-border: #666666; /* 桌面版格線加深 */
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --primary-red: #d00;
            --active-bg: #fff9e6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            font-family: var(--font-family); background-color: var(--bg-color);
            margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }

        #status-panel {
            position: fixed; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.85);
            color: #fff; padding: 10px 15px; border-radius: 8px; font-size: 14px; z-index: 20000;
            transition: opacity 0.5s; pointer-events: none; border-left: 5px solid #2196f3;
        }

        .content-area { flex: 1; position: relative; overflow: hidden; width: 100%; touch-action: none; cursor: grab; }

        /* --- Sheet 1: 今日 (桌面版大字) --- */
#sheet1 { 
    width: 100%; 
    height: 100%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    overflow: hidden; /* 強制隱藏溢出內容 */
}
        .v-col { display: flex; flex-direction: column; align-items: center; height: auto; min-height: 400px; }
        
        .date-col { font-size: clamp(1.6rem, 6vh, 2.8rem); color: var(--text-black); font-weight: 700; gap: 6px; }
        .date-num { font-family: "Helvetica Neue", Arial; margin: 5px 0; font-weight: 900; }
        .v-text { writing-mode: vertical-rl; text-orientation: upright; }
        .roc-title { color: var(--primary-red); margin-bottom: 10px; font-size: 0.8em; font-weight: 900; }
        .lunar-col { font-size: clamp(1.3rem, 4.5vh, 2rem); color: var(--text-gray); font-weight: 700; padding-right: 20px; border-right: 3px solid #ddd; }
        .bazi-col { width: clamp(3.5rem, 12vw, 6rem); justify-content: space-between; }
        .col-header { font-size: clamp(1.2rem, 4vh, 1.8rem); color: #555; margin-bottom: 15px; font-weight: bold; }
        .col-value { font-size: clamp(2.5rem, 9vh, 4.5rem); font-weight: 900; display: flex; flex-direction: column; gap: 15px; margin-bottom: 50px; }

.bazi-container { 
    display: flex; 
    flex-direction: row-reverse; 
    /* 縮小間距：根據螢幕寬度動態調整 */
    gap: clamp(5px, 2.5vw, 30px); 
    padding: 10px; 
    width: 100%;
    max-width: 100vw;
    height: 100%;
    max-height: 100dvh;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
}

.week-block { 
    margin-top: 10px; 
    font-size: clamp(1.5rem, 5vh, 2.5rem); 
    font-weight: 900; 
    /* 移除原本的 writing-mode: vertical-rl */
    display: flex;
    justify-content: center;
    width: 100%;
}
        /* --- Sheet 2: 本月 (桌面版防空曠優化) --- */
        #sheet2 { width: 100%; height: 100%; display: none; }
        .calendar-main { flex: 1; display: flex; flex-direction: column; border-right: 2px solid var(--grid-border); }
        .week-header { display: grid; grid-template-columns: repeat(7, 1fr); height: 45px; background: #e0e0e0; border-bottom: 2px solid var(--grid-border); }
        .week-cell { display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 900; }
        
        .days-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; }
        .day-cell { border-right: 1px solid var(--grid-border); border-bottom: 1px solid var(--grid-border); position: relative; overflow: hidden; }
        
/* 預設為行動裝置/直式佈局 (參考附圖 2) */
.cell-date-num { position: absolute; top: 2px; left: 4px; font-size: 1.2rem; font-weight: 900; }
.cell-jieqi { position: absolute; top: 2px; right: 2px; color: #d00; font-weight: 900; writing-mode: vertical-rl; font-size: 0.9rem; }
.cell-lunar { position: absolute; bottom: 2px; left: 4px; writing-mode: vertical-rl; font-size: 0.8rem; color: #555; font-weight: 900; }
.cell-ganzhi { position: absolute; bottom: 2px; right: 2px; writing-mode: vertical-rl; font-size: 0.8rem; color: #333; font-weight: 700; }

        /* 桌面版日期與文字佈局 */
        .is-today { background-color: var(--active-bg); }
        .is-today .cell-date-num { color: var(--primary-red); }
        
        .side-title-bar { width: clamp(45px, 8vw, 85px); display: flex; align-items: center; justify-content: center; background: #f0f0f0; border-left: 1px solid #ccc; }
        .side-title-text { writing-mode: vertical-rl; text-orientation: upright; font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 900; letter-spacing: 4px; }

/* 桌面版/橫式佈局修正 (參考附圖 1) */
@media (min-width: 1024px) {
    .cell-date-num { font-size: 3.5rem; top: 5px; left: 10px; }
    .cell-jieqi { writing-mode: horizontal-tb; font-size: 1.8rem; top: 10px; right: 10px; }
    /* 橫式時農曆與干支堆疊在左側 */
    .cell-lunar { writing-mode: horizontal-tb; font-size: 1.4rem; bottom: 40px; left: 10px; }
    .cell-ganzhi { writing-mode: horizontal-tb; font-size: 1.4rem; bottom: 10px; left: 10px; right: auto; }
}

/* 針對窄螢幕（直向）進行字體縮放與微調 */
@media (max-width: 480px) {
    .date-col { 
        font-size: clamp(1.1rem, 4.5vh, 1.8rem); 
        gap: 2px;
    }
    .lunar-col { 
        font-size: clamp(0.9rem, 3.5vh, 1.4rem); 
        padding-right: 8px; 
        border-right-width: 2px;
    }
    .bazi-col { 
        width: 3.2rem; /* 固定寬度防止擠壓 */
    }
    .col-header { 
        font-size: 1rem; 
        margin-bottom: 8px; 
    }
    .col-value { 
        font-size: clamp(2rem, 7vh, 3.2rem); 
        gap: 10px; 
        margin-bottom: 20px; 
    }
    .week-block {
        font-size: 1.5rem;
        margin-top: 5px;
    }
}

        /* --- 設定頁面 --- */
        .memo-sheet { width: 100%; height: 100%; display: none; flex-direction: column; padding: 30px; overflow-y: auto; touch-action: pan-y; }
        .config-code-display { background: #222; color: #0f0; padding: 30px; text-align: center; font-family: monospace; font-size: 3rem; border-radius: 15px; margin: 20px 0; letter-spacing: 15px; box-shadow: inset 0 0 15px #000; }
        .config-row { display: flex; justify-content: space-between; align-items: center; padding: 25px 0; border-bottom: 2px solid #eee; }
        .config-label { font-weight: 900; font-size: 1.5rem; }
        select { padding: 15px; font-size: 1.4rem; border-radius: 10px; font-weight: 900; cursor: pointer; }

        /* --- Tab --- */
        .tab-bar { height: clamp(70px, 10vh, 100px); padding-bottom: env(safe-area-inset-bottom); display: flex; border-top: 3px solid #ccc; background: #fff; }
        .tab-btn { flex: 1; border: none; background: none; font-size: 1.5rem; color: #555; font-weight: 900; cursor: pointer; }
        .tab-btn.active { color: #000; font-weight: 900; background: #f0f0f0; border-top: 6px solid var(--primary-red); }
    </style>
    
    <script>
        const CDN_URL = "https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.13/lunar.min.js";
        let currentDate = new Date();
        let currentTab = 'sheet1';
        let isLibReady = false;
        let config = { xAxis: 0, yAxis: 0, hDir: 0, vDir: 0 };

        function initConfigFromFilename() {
            try {
                const path = window.location.pathname;
                const fileName = path.split('/').pop();
                const match = fileName.match(/(\d{4})\.html$/);
                if (match && match[1]) {
                    const code = match[1];
                    config.xAxis = parseInt(code[0]); config.yAxis = parseInt(code[1]);
                    config.hDir = parseInt(code[2]); config.vDir = parseInt(code[3]);
                }
            } catch (e) { console.error("解析失敗", e); }
        }

        function updateConfigDisplay() {
            const code = `${config.xAxis}${config.yAxis}${config.hDir}${config.vDir}`;
            const el = document.getElementById('config-code');
            if (el) el.innerText = code;
        }

        function setStatus(msg, type) {
            const panel = document.getElementById('status-panel');
            panel.innerText = msg; panel.style.opacity = '1';
            if(type === 'ok') setTimeout(() => panel.style.opacity = '0', 2000);
        }

        function loadScript() {
            initConfigFromFilename();
            const script = document.createElement('script');
            script.src = CDN_URL;
            script.onload = () => {
                if (typeof Solar === 'undefined' && window.lunar) window.Solar = window.lunar.Solar;
                isLibReady = true; setStatus("啟動成功 v5.3", "ok");
                updateAllViews();
            };
            document.body.appendChild(script);
        }

        window.onload = loadScript;
    </script>
</head>
<body>

    <div id="status-panel">載入中...</div>

    <div class="content-area" id="touchArea">
        <div id="sheet1">
            <div class="bazi-container">
                <div class="v-col date-col" id="dateCol"></div>
                <div class="v-col lunar-col" id="lunarCol"></div>
                <div class="v-col bazi-col"><div class="col-header v-text">年柱</div><div class="col-value" id="yearGZ">--</div></div>
                <div class="v-col bazi-col"><div class="col-header v-text">月柱</div><div class="col-value" id="monthGZ">--</div></div>
                <div class="v-col bazi-col"><div class="col-header v-text">日柱</div><div class="col-value" id="dayGZ">--</div></div>
            </div>
        </div>

        <div id="sheet2">
            <div class="calendar-main">
                <div class="week-header">
                    <div class="week-cell" style="color:#d00">日</div><div class="week-cell">一</div><div class="week-cell">二</div>
                    <div class="week-cell">三</div><div class="week-cell">四</div><div class="week-cell">五</div><div class="week-cell" style="color:#d00">六</div>
                </div>
                <div class="days-grid" id="daysGrid"></div>
            </div>
            <div class="side-title-bar"><div class="side-title-text" id="sideTitle">--</div></div>
        </div>

        <div id="sheet5" class="memo-sheet">
            <h2 style="text-align:center; margin:0; font-size:2.2rem; font-weight:900;">操作設定</h2>
            <div class="config-code-display" id="config-code">0000</div>
            <div class="config-row"><div class="config-label">今日左右滑</div><select id="sel-xAxis" onchange="config.xAxis=parseInt(this.value);updateConfigDisplay()"><option value="0">加減日期</option><option value="1">加減月份</option></select></div>
            <div class="config-row"><div class="config-label">今日上下滑</div><select id="sel-yAxis" onchange="config.yAxis=parseInt(this.value);updateConfigDisplay()"><option value="0">加減月份</option><option value="1">加減日期</option></select></div>
            <div class="config-row"><div class="config-label">左右方向</div><select id="sel-hDir" onchange="config.hDir=parseInt(this.value);updateConfigDisplay()"><option value="0">左滑增加 / 右滑減少</option><option value="1">左滑減少 / 右滑增加</option></select></div>
            <div class="config-row"><div class="config-label">上下方向</div><select id="sel-vDir" onchange="config.vDir=parseInt(this.value);updateConfigDisplay()"><option value="0">上滑增加 / 下滑減少</option><option value="1">上滑減少 / 下滑增加</option></select></div>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="btn-sheet1" onclick="safeSwitchTab('sheet1')">今日</button>
        <button class="tab-btn" id="btn-sheet2" onclick="safeSwitchTab('sheet2')">本月</button>
        <button class="tab-btn" id="btn-sheet5" onclick="safeSwitchTab('sheet5')">設定</button>
    </div>

    <script>
        function safeSwitchTab(tab) {
            if (!isLibReady) return;
            currentTab = tab;
            if (tab === 'sheet1' || tab === 'sheet2') currentDate = new Date();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + tab)?.classList.add('active');
            ['sheet1', 'sheet2', 'sheet5'].forEach(id => {
                document.getElementById(id).style.display = (id === tab) ? 'flex' : 'none';
            });
            updateAllViews();
            if(tab === 'sheet5') syncUIWithConfig();
        }

        function syncUIWithConfig() {
            document.getElementById('sel-xAxis').value = config.xAxis;
            document.getElementById('sel-yAxis').value = config.yAxis;
            document.getElementById('sel-hDir').value = config.hDir;
            document.getElementById('sel-vDir').value = config.vDir;
            updateConfigDisplay();
        }

        function updateAllViews() {
            if (!isLibReady) return;
            renderSheet1(); renderSheet2();
        }

        function renderSheet1() {
            const y = currentDate.getFullYear(), m = currentDate.getMonth() + 1, d = currentDate.getDate();
            const solar = Solar.fromYmd(y, m, d);
            const lunar = solar.getLunar();
            const weekStr = ['日', '一', '二', '三', '四', '五', '六'][currentDate.getDay()];
            document.getElementById('dateCol').innerHTML = `<div class="v-text roc-title">民國</div><div class="date-num">${y-1911}</div><div class="v-text">年</div><div class="date-num">${m}</div><div class="v-text">月</div><div class="date-num">${d}</div><div class="v-text">日</div><div class="week-block">(${weekStr})</div>`;
            document.getElementById('lunarCol').innerHTML = `<div class="v-text roc-title">農曆</div><div class="v-text" style="font-size:1.1em; margin-top:10px; color:#000; font-weight:900;">${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}</div>`;
            const setGZ = (id, text) => { document.getElementById(id).innerHTML = `<span>${text[0]}</span><span>${text[1]}</span>`; };
            setGZ('yearGZ', lunar.getYearInGanZhiExact());
            setGZ('monthGZ', lunar.getMonthInGanZhiExact());
            setGZ('dayGZ', lunar.getDayInGanZhiExact());
        }

        function renderSheet2() {
            const grid = document.getElementById('daysGrid'); grid.innerHTML = '';
            const y = currentDate.getFullYear(), m = currentDate.getMonth() + 1;
            document.getElementById('sideTitle').innerText = `民國${y-1911}年${m}月`;
            const firstDay = new Date(y, m - 1, 1).getDay();
            const daysInMonth = new Date(y, m, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell'; empty.style.background = "#f5f5f5"; grid.appendChild(empty);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const cell = document.createElement('div');
                cell.className = `day-cell ${(i === currentDate.getDate()) ? 'is-today' : ''}`;
                try {
                    const l = Solar.fromYmd(y, m, i).getLunar();
                    const jq = l.getJieQi();
                    cell.innerHTML = `
                        ${jq ? `<div class="cell-jieqi">${jq}</div>` : ''}
                        <div class="cell-date-num">${i}</div>
                        <div class="cell-ganzhi">${l.getDayInGanZhiExact()}</div>
                        <div class="cell-lunar">${l.getMonthInChinese()}月${l.getDayInChinese()}</div>
                    `;
                } catch(e) {}
                cell.onclick = () => { currentDate = new Date(y, m-1, i); renderSheet1(); renderSheet2(); };
                grid.appendChild(cell);
            }
        }

        let startX = 0, startY = 0, isMoving = false;
        const ta = document.getElementById('touchArea');
        const start = (x, y) => { startX = x; startY = y; isMoving = true; };
        const end = (x, y) => {
            if (!isMoving || currentTab === 'sheet5') return;
            isMoving = false;
            const dx = startX - x, dy = startY - y, threshold = 40;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > threshold) {
                    const delta = (dx > 0 ? 1 : -1) * (config.hDir === 0 ? 1 : -1);
                    currentTab === 'sheet1' ? (config.xAxis === 0 ? changeDay(delta) : changeMonth(delta)) : changeMonth(delta);
                }
            } else {
                if (Math.abs(dy) > threshold) {
                    const delta = (dy > 0 ? 1 : -1) * (config.vDir === 0 ? 1 : -1);
                    currentTab === 'sheet1' ? (config.yAxis === 0 ? changeMonth(delta) : changeDay(delta)) : changeMonth(delta);
                }
            }
        };
        ta.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
        ta.addEventListener('touchend', e => end(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive: true });
        ta.addEventListener('mousedown', e => start(e.clientX, e.clientY));
        window.addEventListener('mouseup', e => end(e.clientX, e.clientY));

        function changeDay(n) { currentDate.setDate(currentDate.getDate() + n); updateAllViews(); }
        function changeMonth(n) { 
            const d = currentDate.getDate();
            currentDate.setMonth(currentDate.getMonth() + n);
            if (currentDate.getDate() < d) currentDate.setDate(0);
            updateAllViews();
        }
    </script>
</body>
</html>
